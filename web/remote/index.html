<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24211d">
<title>QuuBee Remote Keyboard</title>
<style>
:root {
    --bg: #24211d; --bar-fg: #cfc8b9; --bar-dim: #8a8377;
    --key: #ebe5d4; --key-fg: #2f2b25; --key-edge: #b9b19c;
    --fn: #b9b3a5; --fn-fg: #2f2b25; --fn-edge: #8f8879;
    --down: #9db7d6; --down-edge: #6f8fb3;
    --lock: #6b8f3f; --lock-fg: #fff;
    --ok: #8fc35a; --wait: #d9b44a; --bad: #d0675b;
}
html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--bar-fg);
    font-family: "Noto Sans CJK JP", "Hiragino Sans", system-ui, sans-serif;
    overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app { display: flex; flex-direction: column; height: 100dvh; box-sizing: border-box;
       padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 13px; min-height: 22px; }
#dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: var(--bar-dim); }
#dot.open { background: var(--ok); }
#dot.connecting, #dot.signal, #dot.waiting { background: var(--wait); }
#dot.failed, #dot.replaced, #dot.none { background: var(--bad); }
#status { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#brand { flex: 0 0 auto; color: var(--bar-dim); font-size: 12px; letter-spacing: .04em; }
#bar button {
    flex: 0 0 auto; font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 4px; cursor: pointer;
    background: transparent; color: var(--bar-fg); border: 1px solid #5a554c;
}
#bar button[hidden] { display: none; }
#hint { flex: 0 0 auto; text-align: center; font-size: 12px; color: var(--bar-dim); padding: 0 12px 4px; }
#hint[hidden] { display: none; }
#stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 8px 8px; }
#board { position: relative; touch-action: none; }
.key {
    position: absolute; box-sizing: border-box; border-radius: 5px;
    background: var(--key); color: var(--key-fg); border: 1px solid var(--key-edge); border-bottom-width: 3px;
    line-height: 1.05; overflow: hidden;
}
.key .l, .key .s, .key .ks, .key .kn { position: absolute; white-space: nowrap; }
.key .l { left: 12%; top: 50%; transform: translateY(-50%); font-size: 1.05em; }
.key .s { left: 50%; top: 5%; transform: translateX(-50%); font-size: .8em; }
.key .ks { right: 10%; top: 50%; transform: translateY(-50%); font-size: .8em; }
.key .kn { left: 50%; bottom: 5%; transform: translateX(-50%); font-size: .8em; }
/* 文字・テンキー・スペース以外のキーは同じ色 (実機は ESC も TAB も CTRL も SHIFT もカーソルも同じ灰色) */
.key.fn, .key.mod, .key.lock { background: var(--fn); color: var(--fn-fg); border-color: var(--fn-edge);
    display: flex; align-items: center; justify-content: center; text-align: center; font-size: .72em; }
.key.fn .l, .key.mod .l, .key.lock .l { position: static; transform: none; font-size: 1em; white-space: normal; }
/* テンキーまわりは刻印が中央・大きめ */
.key.center { display: flex; align-items: center; justify-content: center; font-size: 1.15em; }
.key.center .l { position: static; transform: none; }
/* 左下のランプ (CAPS・カナ。実機は四角い緑の発光) */
.leds { position: absolute; border-radius: 5px; background: #3a3630; border: 1px solid #47423a; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center;
        gap: .35em; padding-left: 1.6em; font-size: .62em; color: var(--bar-dim); pointer-events: none; white-space: nowrap; }
.leds span { display: flex; align-items: center; gap: .5em; }
.leds i { display: inline-block; width: .75em; height: .75em; border-radius: 1px; background: #2f3a2c; }
.leds i.on { background: #5dff5a; box-shadow: 0 0 .6em #5dff5a; }
.key.down { background: var(--down); border-color: var(--down-edge); border-bottom-width: 1px; }
.key.locked, .key.latched { background: var(--lock); border-color: var(--lock); color: var(--lock-fg); }
.key.latched { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
</style>
</head>
<body>
<div id="app">
    <div id="bar">
        <span id="dot"></span>
        <span id="status"></span>
        <button id="fullscreen" hidden>Full screen</button>
        <span id="brand">QuuBee Remote</span>
    </div>
    <div id="hint" hidden>横向きにすると、キーが大きくなります。</div>
    <div id="stage"><div id="board"></div></div>
</div>
<script src="link.js"></script>
<script src="keyboard.js"></script>
</body>
</html>
